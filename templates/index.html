<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KisanMitra AI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div class="wrap"><h1>🌾 KisanMitra AI</h1><p>Smart Farming & Farmer Assistance System</p><span id="status">Not logged in</span></div></header>
<main class="wrap">
<section class="hero"><h2>Make smarter farming decisions</h2><p>Enter soil and climate values to get a preliminary crop recommendation.</p></section>
<div class="two"><section class="card"><h2>Farmer Registration</h2><input id="name" placeholder="Full name"><input id="remail" type="email" placeholder="Email"><input id="rpassword" type="password" placeholder="Password"><input id="location" placeholder="Village / District"><button onclick="register()">Create Account</button><p id="regMsg"></p></section>
<section class="card"><h2>Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><button class="secondary" onclick="logout()">Logout</button><p id="loginMsg"></p></section></div>
<section class="card"><h2>🌱 AI Crop Recommendation</h2><div class="grid"><input id="n" type="number" placeholder="Nitrogen (N)"><input id="p" type="number" placeholder="Phosphorus (P)"><input id="k" type="number" placeholder="Potassium (K)"><input id="temperature" type="number" placeholder="Temperature °C"><input id="humidity" type="number" placeholder="Humidity %"><input id="ph" type="number" step="0.1" placeholder="Soil pH"><input id="rainfall" type="number" placeholder="Rainfall mm"></div><button onclick="recommend()">Get Recommendation</button><div id="result" class="result"></div></section>
<section class="card"><h2>💬 Farming Assistant</h2><textarea id="question" placeholder="Ask about irrigation, fertilizer, soil or crops..."></textarea><button onclick="assistant()">Ask Assistant</button><p id="answer"></p></section>
<section class="card"><h2>📋 Recommendation History</h2><button onclick="loadHistory()">Refresh History</button><div id="history"></div></section>
</main><script src="/static/app.js"></script></body></html>
